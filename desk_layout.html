<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デスクレイアウト設計図</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
      background: #F8F6F2;
      color: #444;
      padding: 48px 32px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
      color: #2A2A2A;
    }
    .page-meta {
      font-size: 12px;
      color: #AAAAAA;
      letter-spacing: 0.08em;
      margin-bottom: 52px;
    }
    .diagram-section { margin-bottom: 60px; }
    .view-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #BBBBBB;
      margin-bottom: 14px;
    }
    svg { display: block; overflow: visible; }
    .legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 24px;
      padding: 16px 20px;
      background: #F0EDE8;
      border-radius: 4px;
      width: fit-content;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #777;
      letter-spacing: 0.04em;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="page-title">デスクセットアップ設計図</div>
  <div class="page-meta">200cm デスク ／ ALEX 引き出し（右端） ／ アークランプ（左）／ 奥行き 65cm ／ 全幅 250cm</div>

  <!-- ═══════════════════════════════════════
       TOP VIEW
  ════════════════════════════════════════ -->
  <div class="diagram-section">
    <div class="view-label">TOP VIEW — 上面図（俯瞰）</div>
    <svg width="660" height="290" viewBox="0 0 660 290">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0L0 0 0 20" fill="none" stroke="#EAE7E1" stroke-width="0.5"/>
        </pattern>
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF5D0" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#FFF5D0" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Grid background -->
      <rect x="40" y="25" width="560" height="185" fill="url(#grid)"/>

      <!-- Wall -->
      <rect x="40" y="25" width="560" height="9" fill="#C0BDB5" rx="1"/>
      <text x="32" y="32" font-size="9" fill="#C0BDB5" text-anchor="end" dominant-baseline="middle">壁</text>

      <!-- ─── LAMP ZONE (50cm = 108px, x:40–148) ─── -->
      <!-- Glow -->
      <circle cx="94" cy="108" r="42" fill="url(#lampGlow)"/>
      <!-- Arc arm suggestion (top view = line from base toward desk) -->
      <path d="M 94 108 Q 128 80 148 65" fill="none" stroke="#C4A870" stroke-width="2"
            stroke-dasharray="5,3" opacity="0.7"/>
      <!-- Shade (top view = circle) -->
      <circle cx="148" cy="58" r="20" fill="#ECD9A8" stroke="#C4A870" stroke-width="1.5" opacity="0.85"/>
      <!-- Pole base -->
      <ellipse cx="94" cy="108" rx="14" ry="5" fill="#A08060" opacity="0.7"/>
      <circle cx="94" cy="108" r="5" fill="#7A6040" stroke="#604820" stroke-width="1"/>

      <text x="72" y="150" font-size="10" fill="#A08060" text-anchor="middle">アーク</text>
      <text x="72" y="163" font-size="10" fill="#A08060" text-anchor="middle">ランプ</text>

      <!-- Zone divider -->
      <line x1="148" y1="34" x2="148" y2="210" stroke="#DDD8D0" stroke-width="1" stroke-dasharray="5,4"/>

      <!-- ─── DESK SURFACE (200cm=432px, x:148–580, depth 65cm=140px, y:34–174) ─── -->
      <rect x="148" y="34" width="432" height="140" fill="#EDE8DC" stroke="#C4BA9E" stroke-width="1.5" rx="2"/>

      <!-- ─── ALEX DRAWER (36cm=78px wide, 58cm=125px deep) right side ─── -->
      <rect x="503" y="34" width="77" height="125" fill="#DDDAD4" stroke="#B4B0A8" stroke-width="1.5" rx="2"/>
      <line x1="520" y1="57"  x2="564" y2="57"  stroke="#A4A09A" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="520" y1="80"  x2="564" y2="80"  stroke="#A4A09A" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="520" y1="103" x2="564" y2="103" stroke="#A4A09A" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="520" y1="126" x2="564" y2="126" stroke="#A4A09A" stroke-width="1.5" stroke-linecap="round"/>
      <text x="541" y="46" font-size="9" fill="#908C86" text-anchor="middle" font-weight="600" letter-spacing="0.08em">ALEX</text>

      <!-- ─── RECORD PLAYER (45×36cm = 97×78px) ─── -->
      <rect x="160" y="44" width="97" height="78" fill="#ACA498" stroke="#8A8278" stroke-width="1.5" rx="3"/>
      <!-- Platter -->
      <circle cx="209" cy="83" r="28" fill="#9C948A" stroke="#726A60" stroke-width="1"/>
      <circle cx="209" cy="83" r="14" fill="#888078" stroke="#686058" stroke-width="0.8"/>
      <circle cx="209" cy="83" r="4"  fill="#585048"/>
      <!-- Tonearm -->
      <line x1="231" y1="49" x2="222" y2="76" stroke="#484840" stroke-width="2" stroke-linecap="round"/>
      <circle cx="222" cy="76" r="3.5" fill="#484840"/>
      <text x="209" y="134" font-size="9" fill="#7A7268" text-anchor="middle">レコードプレーヤー</text>

      <!-- ─── MONITOR stand footprint (back edge) ─── -->
      <rect x="261" y="34" width="134" height="7" fill="#383838" rx="1" opacity="0.65"/>
      <!-- Stand base -->
      <rect x="289" y="36" width="78" height="16" fill="#C0C0C0" stroke="#989898" stroke-width="1" rx="2"/>
      <text x="328" y="64" font-size="9" fill="#888" text-anchor="middle">27"  モニター</text>

      <!-- ─── SPEAKERS ─── -->
      <rect x="262" y="44" width="20" height="28" fill="#CCCCCC" stroke="#AAAAAA" stroke-width="1" rx="3"/>
      <rect x="376" y="44" width="20" height="28" fill="#CCCCCC" stroke="#AAAAAA" stroke-width="1" rx="3"/>

      <!-- ─── SMALL PLANT (right area) ─── -->
      <circle cx="466" cy="54" r="13" fill="#82A870" stroke="#628A50" stroke-width="1.5"/>
      <circle cx="466" cy="54" r="4"  fill="#72986A"/>
      <text x="466" y="79" font-size="9" fill="#628A50" text-anchor="middle">植物</text>

      <!-- ─── CHAIR ─── -->
      <path d="M 205 174 Q 200 232 268 232 L 390 232 Q 458 232 453 174"
            fill="#E8E4DC" stroke="#C4BEB0" stroke-width="1.5" fill-opacity="0.75"/>
      <text x="329" y="225" font-size="10" fill="#C8C4BC" text-anchor="middle" letter-spacing="0.06em">エルゴチェア</text>

      <!-- ─── DIMENSION LINES ─── -->
      <!-- Total 250cm -->
      <line x1="40"  y1="250" x2="600" y2="250" stroke="#BBBBBB" stroke-width="1"/>
      <line x1="40"  y1="245" x2="40"  y2="255" stroke="#BBBBBB" stroke-width="1.5"/>
      <line x1="600" y1="245" x2="600" y2="255" stroke="#BBBBBB" stroke-width="1.5"/>
      <text x="320" y="267" font-size="11" fill="#AAAAAA" text-anchor="middle" letter-spacing="0.05em">250 cm</text>

      <!-- Lamp 50cm -->
      <line x1="40"  y1="238" x2="148" y2="238" stroke="#C4A870" stroke-width="0.8"/>
      <line x1="40"  y1="233" x2="40"  y2="243" stroke="#C4A870" stroke-width="1"/>
      <line x1="148" y1="233" x2="148" y2="243" stroke="#C4A870" stroke-width="1"/>
      <text x="94" y="232" font-size="9" fill="#C4A870" text-anchor="middle">50 cm</text>

      <!-- Desk 200cm -->
      <line x1="148" y1="238" x2="580" y2="238" stroke="#8A7A5E" stroke-width="0.8"/>
      <line x1="580" y1="233" x2="580" y2="243" stroke="#8A7A5E" stroke-width="1"/>
      <text x="364" y="232" font-size="9" fill="#8A7A5E" text-anchor="middle">200 cm</text>

      <!-- Depth 65cm -->
      <line x1="614" y1="34"  x2="614" y2="174" stroke="#BBBBBB" stroke-width="0.8"/>
      <line x1="609" y1="34"  x2="619" y2="34"  stroke="#BBBBBB" stroke-width="1"/>
      <line x1="609" y1="174" x2="619" y2="174" stroke="#BBBBBB" stroke-width="1"/>
      <text x="630" y="107" font-size="9" fill="#BBBBBB" text-anchor="middle"
            transform="rotate(90,630,107)">65 cm</text>
    </svg>
  </div>

  <!-- ═══════════════════════════════════════
       FRONT VIEW
  ════════════════════════════════════════ -->
  <div class="diagram-section">
    <div class="view-label">FRONT VIEW — 正面図</div>
    <!-- Scale: horizontal 1cm=2.16px (250cm=540px), vertical 1cm=1.6px -->
    <!-- Floor at y=308, desk surface at y=308-72*1.6=308-115=193 -->
    <!-- Lamp top: 308-170*1.6=308-272=36 -->
    <svg width="660" height="370" viewBox="0 0 660 370">

      <!-- Wall -->
      <rect x="40" y="20" width="560" height="290" fill="#F0EDE8"/>

      <!-- Floor -->
      <rect x="30" y="308" width="580" height="7" fill="#C8C4B8" rx="1"/>

      <!-- ─── FLOOR LAMP (arc style, base at x=94) ─── -->
      <!-- Base weight -->
      <ellipse cx="90" cy="306" rx="20" ry="6" fill="#888060" opacity="0.8"/>
      <rect x="82" y="300" width="16" height="6" fill="#7A7050" rx="1"/>
      <!-- Pole -->
      <line x1="90" y1="300" x2="90" y2="200" stroke="#A08858" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Arc arm -->
      <path d="M 90 200 Q 110 130 180 65" fill="none" stroke="#A08858" stroke-width="3"
            stroke-linecap="round"/>
      <!-- Shade (hangs over desk area) -->
      <ellipse cx="180" cy="58" rx="30" ry="10" fill="#DDD0A0" stroke="#C0A868" stroke-width="1.5"/>
      <path d="M 150 58 Q 180 98 210 58" fill="#E8D8A8" stroke="#C0A868" stroke-width="1.5"/>
      <!-- Light cone -->
      <polygon points="158,68 202,68 215,193 145,193"
               fill="#FFF8D0" opacity="0.12"/>
      <text x="86" y="328" font-size="9"  fill="#A08858" text-anchor="middle">アークランプ</text>
      <text x="86" y="340" font-size="8"  fill="#C0A870" text-anchor="middle">H≈170cm</text>

      <!-- ─── DESK SURFACE ─── -->
      <!-- Top edge -->
      <rect x="148" y="190" width="432" height="9" fill="#C8BC9A" stroke="#ACA082" stroke-width="1.5"/>
      <!-- Under-desk shadow -->
      <rect x="148" y="199" width="432" height="109" fill="#EEE8DA" stroke="#C8BC9A"
            stroke-width="0.5" stroke-dasharray="0"/>

      <!-- Left leg -->
      <rect x="151" y="199" width="10" height="109" fill="#C0B898" stroke="#A0988A" stroke-width="1"/>

      <!-- ─── ALEX DRAWER (right, 36cm=78px wide, 70cm=112px tall) ─── -->
      <rect x="503" y="199" width="77" height="109" fill="#E2DEDA" stroke="#C0BCB6" stroke-width="1.5" rx="2"/>
      <rect x="516" y="210" width="48" height="5" fill="#B4B0AA" rx="2"/>
      <rect x="516" y="232" width="48" height="5" fill="#B4B0AA" rx="2"/>
      <rect x="516" y="254" width="48" height="5" fill="#B4B0AA" rx="2"/>
      <rect x="516" y="276" width="48" height="5" fill="#B4B0AA" rx="2"/>
      <line x1="503" y1="222" x2="580" y2="222" stroke="#D4D0CA" stroke-width="0.8"/>
      <line x1="503" y1="244" x2="580" y2="244" stroke="#D4D0CA" stroke-width="0.8"/>
      <line x1="503" y1="266" x2="580" y2="266" stroke="#D4D0CA" stroke-width="0.8"/>
      <line x1="503" y1="288" x2="580" y2="288" stroke="#D4D0CA" stroke-width="0.8"/>
      <text x="541" y="208" font-size="9" fill="#8A8884" text-anchor="middle" font-weight="600" letter-spacing="0.08em">ALEX</text>

      <!-- ─── RECORD PLAYER (45cm=97px, 15cm=24px tall) ─── -->
      <rect x="160" y="165" width="97" height="25" fill="#A89E92" stroke="#827870" stroke-width="1.5" rx="3"/>
      <!-- Platter (front view = ellipse) -->
      <ellipse cx="209" cy="165" rx="28" ry="7" fill="#8A8278" stroke="#686058" stroke-width="1"/>
      <ellipse cx="209" cy="165" rx="7"  ry="3" fill="#585048"/>
      <!-- Tonearm -->
      <line x1="232" y1="169" x2="223" y2="165" stroke="#484840" stroke-width="1.5" stroke-linecap="round"/>
      <text x="209" y="210" font-size="9" fill="#8A8278" text-anchor="middle">レコード</text>
      <text x="209" y="222" font-size="9" fill="#8A8278" text-anchor="middle">プレーヤー</text>

      <!-- ─── SPEAKERS ─── -->
      <!-- Left -->
      <rect x="268" y="158" width="22" height="32" fill="#D2D2D2" stroke="#A8A8A8" stroke-width="1" rx="3"/>
      <circle cx="279" cy="168" r="7"  fill="#B8B8B8" stroke="#909090" stroke-width="1"/>
      <circle cx="279" cy="181" r="3"  fill="#C8C8C8" stroke="#A8A8A8" stroke-width="0.5"/>
      <!-- Right -->
      <rect x="368" y="158" width="22" height="32" fill="#D2D2D2" stroke="#A8A8A8" stroke-width="1" rx="3"/>
      <circle cx="379" cy="168" r="7"  fill="#B8B8B8" stroke="#909090" stroke-width="1"/>
      <circle cx="379" cy="181" r="3"  fill="#C8C8C8" stroke="#A8A8A8" stroke-width="0.5"/>

      <!-- ─── MONITOR (27in, 62cm=134px wide, 37cm=59px tall) ─── -->
      <!-- Stand -->
      <rect x="308" y="181" width="40" height="9" fill="#909090" rx="1"/>
      <line x1="328" y1="181" x2="328" y2="148" stroke="#888888" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Bezel -->
      <rect x="261" y="120" width="134" height="88" fill="#1C1C1C" rx="5"/>
      <!-- Screen -->
      <rect x="266" y="125" width="124" height="78" fill="#2A3F6A" rx="2"/>
      <!-- Screen content -->
      <rect x="272" y="131" width="55" height="38" fill="#3A5585" rx="1" opacity="0.7"/>
      <rect x="334" y="131" width="50" height="17" fill="#4A6595" rx="1" opacity="0.55"/>
      <rect x="334" y="154" width="50" height="10" fill="#3A5080" rx="1" opacity="0.45"/>
      <text x="328" y="172" font-size="9" fill="#8AA8CC" text-anchor="middle" opacity="0.9">27"</text>

      <!-- ─── SMALL PLANT (right zone) ─── -->
      <rect x="446" y="183" width="26" height="7" fill="#8A7A60" rx="2"/>
      <ellipse cx="459" cy="174" rx="20" ry="15" fill="#78A058" stroke="#589038" stroke-width="1.5"/>
      <ellipse cx="445" cy="179" rx="11" ry="9"  fill="#689048" stroke="#487030" stroke-width="1" opacity="0.8"/>

      <!-- ─── ITEMS ON ALEX ─── -->
      <!-- Books -->
      <rect x="508" y="177" width="7"  height="13" fill="#C86840" stroke="#A04820" stroke-width="0.5"/>
      <rect x="515" y="174" width="7"  height="16" fill="#4878A8" stroke="#285888" stroke-width="0.5"/>
      <rect x="522" y="178" width="6"  height="12" fill="#78A840" stroke="#508020" stroke-width="0.5"/>
      <!-- Framed print -->
      <rect x="552" y="168" width="22" height="22" fill="#ECE8E0" stroke="#888" stroke-width="1.5"/>
      <rect x="556" y="172" width="14" height="14" fill="#D4CBBF"/>

      <!-- ─── DIMENSION LINES ─── -->
      <!-- Total 250cm -->
      <line x1="40"  y1="348" x2="580" y2="348" stroke="#C0C0C0" stroke-width="1"/>
      <line x1="40"  y1="343" x2="40"  y2="353" stroke="#C0C0C0" stroke-width="1.5"/>
      <line x1="580" y1="343" x2="580" y2="353" stroke="#C0C0C0" stroke-width="1.5"/>
      <text x="310" y="364" font-size="11" fill="#BBBBBB" text-anchor="middle" letter-spacing="0.05em">250 cm</text>

      <!-- Desk height 72cm -->
      <line x1="20"  y1="190" x2="20"  y2="308" stroke="#8A7A5E" stroke-width="0.8"/>
      <line x1="14"  y1="190" x2="26"  y2="190" stroke="#8A7A5E" stroke-width="1"/>
      <line x1="14"  y1="308" x2="26"  y2="308" stroke="#8A7A5E" stroke-width="1"/>
      <text x="9" y="252" font-size="9" fill="#8A7A5E" text-anchor="middle"
            transform="rotate(-90,9,252)">72 cm</text>

      <!-- Lamp height 170cm -->
      <line x1="125" y1="36"  x2="125" y2="308" stroke="#C4A870" stroke-width="0.8"/>
      <line x1="119" y1="36"  x2="131" y2="36"  stroke="#C4A870" stroke-width="1"/>
      <line x1="119" y1="308" x2="131" y2="308" stroke="#C4A870" stroke-width="1"/>
      <text x="137" y="176" font-size="9" fill="#C4A870" text-anchor="middle"
            transform="rotate(90,137,176)">〜170 cm</text>

      <!-- Monitor height annotation -->
      <line x1="400" y1="120" x2="400" y2="190" stroke="#BBBBBB" stroke-width="0.8"/>
      <line x1="395" y1="120" x2="405" y2="120" stroke="#BBBBBB" stroke-width="1"/>
      <line x1="395" y1="190" x2="405" y2="190" stroke="#BBBBBB" stroke-width="1"/>
      <text x="414" y="157" font-size="9" fill="#BBBBBB" text-anchor="start">60 cm</text>

    </svg>
  </div>

  <!-- ─── LEGEND ─── -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#ACA498;border:1px solid #8A8278;"></div>
      レコードプレーヤー
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#D2D2D2;border:1px solid #A8A8A8;"></div>
      デスクスピーカー
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#1C1C1C;"></div>
      27" モニター
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#E2DEDA;border:1px solid #C0BCB6;"></div>
      ALEX 引き出し
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#78A058;border:1px solid #589038;"></div>
      小型観葉植物
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#DDD0A0;border:1px solid #C0A868;"></div>
      アークスタンドランプ
    </div>
  </div>

</body>
</html>
